    ageGateLabel: 'Confirmo que tengo 13 a\u00f1os o m\u00e1s, o que soy padre, madre o tutor que accede en nombre de un menor.',
    beginTrialBtn: 'Comenzar 2 lecciones gratis \u00a0\u2192',
    alreadySubscriber: '\u00bfYa es suscriptor?',
    signInLink: 'Iniciar sesi\u00f3n aqu\u00ed \u00a0\u2192',
    footerPrivacy: 'Pol\u00edtica de privacidad',
    footerTerms: 'T\u00e9rminos de uso',
    sent: (email) => 'Revise su correo \u2013 enviamos un enlace a ' + email + '. \u00c1bralo en este dispositivo para comenzar sus 2 lecciones gratis.',
    err: 'No pudimos enviar el enlace. Verifique la direcci\u00f3n e int\u00e9ntelo de nuevo.',
    rate: 'Demasiadas solicitudes. Espere unos minutos e int\u00e9ntelo de nuevo.',
    age: 'Confirme su edad para continuar.'
  }
};

let currentLang = 'en';
const urlLang = new URLSearchParams(window.location.search).get('lang');
if (urlLang && STRINGS[urlLang]) currentLang = urlLang;
function S(key){ return STRINGS[currentLang][key] !== undefined ? STRINGS[currentLang][key] : STRINGS.en[key]; }

function applyLanguage(lang) {
  currentLang = lang;
  document.documentElement.lang = STRINGS[lang].htmlLang;
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = STRINGS[lang][el.dataset.i18n]; if (typeof v === 'string') el.innerHTML = v; });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const v = STRINGS[lang][el.dataset.i18nPlaceholder]; if (v) el.placeholder = v; });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.getElementById('signInLink').href = '/?lang=' + lang;
}
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => applyLanguage(b.dataset.lang)));
applyLanguage(currentLang);

// Already signed in: go straight to the subject screen.
sb.auth.getSession().then(({ data }) => { if (data && data.session) window.location.replace('/'); });

const trialEmailInput = document.getElementById('trialEmail');
const ageCheckbox = document.getElementById('ageCheck');
const beginTrialBtn = document.getElementById('beginTrialBtn');
const entryError = document.getElementById('entryError');

function checkEntryReady() { beginTrialBtn.disabled = !(/\S+@\S+\.\S+/.test(trialEmailInput.value.trim()) && ageCheckbox.checked); }
trialEmailInput.addEventListener('input', () => { entryError.textContent = ''; checkEntryReady(); });
ageCheckbox.addEventListener('change', checkEntryReady);

beginTrialBtn.addEventListener('click', async () => {
  if (!ageCheckbox.checked) { entryError.textContent = S('age'); return; }
  const email = trialEmailInput.value.trim().toLowerCase();
  beginTrialBtn.disabled = true;
  entryError.textContent = '';
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.origin + '/' } });
  if (error) {
    entryError.textContent = error.status === 429 ? S('rate') : S('err');
    beginTrialBtn.disabled = false;
    return;
  }
  const sent = document.getElementById('trialSentMsg');
  sent.textContent = S('sent')(email);
  sent.style.display = 'block';
  beginTrialBtn.style.display = 'none';
});
</script>
</body>
</html>
